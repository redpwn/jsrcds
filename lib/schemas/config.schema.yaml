type: object
properties:
  googleProject:
    type: string
  googleZone:
    type: string
  challengeHost:
    type: string
  flagRegex:
    type: string
  images:
    type: object
    properties:
      registry:
        type: string
      challengesBase:
        type: string
      cacheBase:
        type: string
    required:
      - registry
      - challengesBase
      - cacheBase
  uploads:
    type: object
    properties:
      bucket:
        type: string
      prefix:
        type: string
    required:
      - bucket
      - prefix
  scoreboard:
    type: object
    properties:
      rctf:
        type: object
        properties:
          url:
            type: string
          tokenNames:
            type: object
            properties:
              read:
                type: string
              write:
                type: string
            required:
              - read
              - write
          defaultPoints:
            type: object
            properties:
              min:
                type: integer
              max:
                type: integer
            required:
              - min
              - max
        required:
          - url
          - tokenNames
          - defaultPoints
    required:
      - rctf
  deploy:
    type: object
    properties:
      kubernetes:
        type: object
        properties:
          clusterName:
            type: string
          defaultResources:
            type: object
            properties:
              requests:
                type: object
                properties:
                  cpu:
                    type: string
                  memory:
                    type: string
                required:
                  - cpu
                  - memory
              limits:
                type: object
                properties:
                  cpu:
                    type: string
                  memory:
                    type: string
                required:
                  - cpu
                  - memory
            required:
              - requests
              - limits
        required:
          - clusterName
          - defaultResources
    required:
      - kubernetes
  monitoring:
    type: object
    properties:
      enable:
        type: boolean
    required:
      - enable
required:
  - googleProject
  - googleZone
  - challengeHost
  - flagRegex
  - images
  - uploads
  - scoreboard
  - deploy
  - monitoring
