# yaml-language-server: $schema=https://json-schema.org/draft-07/schema
definitions:
  domainsafe-name:
    type: string
    # domains are limited to 63 characters but we prefix with deploy tag
    pattern: "^[a-z0-9]([a-z0-9-]{0,48}[a-z0-9])?$"
  cpu-value:
    oneOf:
      - type: string
        pattern: "^[0-9]+m$"
      - type: number
  memory-value:
    oneOf:
      - type: string
        pattern: "^[0-9]+[KMGTE]i?$"
      - type: number
type: object
properties:
  # Basic challenge details
  id:
    $ref: "#/definitions/domainsafe-name"
    description: >-
      Override the automatically generated id for this challenge. You should
      avoid setting this whenever possible.
  name:
    type: string
    description: >-
      The name of the challenge
  author:
    description: >-
      The author(s) of the challenge
    oneOf:
      - type: string
      - type: array
        items:
          type: string
  description:
    type: string
    description: >-
      Description of the challenge. It is in Markdown format and will be
      processed with Handlebars.
  category:
    type: string
    description: >-
      Category of the challenge. If not provided, defaults to the parent
      directory of the challenge (e.g. if this file is located at
      /pwn/chall1/challenge.yaml, the category will default to 'pwn').
  tiebreakEligible:
    type: boolean
    description: >-
      Whether or not this challenge is eligible for tiebreakers. This is
      generally only used for challenges that are not worth full points.
  sortWeight:
    type: integer
    description: >-
      The weight to use when sorting challenges. This is used to sort
      challenges within a category.
  flag:
    description: >-
      The flag for the challenge.
    oneOf:
      - type: string
      - type: object
        properties:
          file:
            type: string
            description: >-
              File to load the flag from. The file should contain one line with
              only the flag.
        required:
          - file
  value:
    description: >-
      The point value of the challenge. Static if set to an integer, dynamic if
      min and max are provided. Defaults to dynamic with competition min and
      max values.
    oneOf:
      - type: integer
        minimum: 0
      - type: object
        properties:
          min:
            type: integer
            minimum: 0
          max:
            type: integer
            minimum: 0
        required:
          - min
          - max

  visible:
    type: boolean
    description: >-
      Whether or not this challenge should be shown on the scoreboard. Default true.

  # Static assets
  provide:
    type: array
    description: >-
      Static files to provide to competitors
    items:
      oneOf:
        - type: string
          description: >-
            Path to the file to provide
        - type: object
          properties:
            url:
              type: string
              pattern: ^https?://
              description: >-
                URL to download the file from
            file:
              type: string
              description: >-
                Path to the file to provide
            as:
              type: string
              description: >-
                Name of file as shown to competitors
          oneOf:
            - required:
                - url
            - required:
                - file

  # Runtime (containers)
  deployed:
    type: boolean
    description: >-
      Whether or not this challenge's containers should be deployed. Default true.
  containers:
    type: object
    description: >-
      Containers to be deployed for this challenge. The key of each container
      is its name, where the container can be found via DNS lookup at runtime
      from other containers within this challenge.
    additionalProperties:
      type: object
      properties:
        image:
          type: string
          description: >-
            The image tag for this container. If 'build' is not specified, the
            container will be pulled (e.g. containers for services like a
            database found on dockerhub). If 'build' is specified, this
            overrides the 'name' (default the name of the directory specified in
            'build') in the image tag template defined globally in the project.
        build:
          oneOf:
            - type: string
              description: >-
                Path to the directory containing a Dockerfile to build for this container.
            - type: object
              description: >-
                Complex build configuration object roughly mirroring that of
                docker-compose.yml.
              properties:
                context:
                  type: string
                  description: >-
                    Path to the build context
                dockerfile:
                  type: string
                  description: >-
                    Path to the Dockerfile within the build context
                args:
                  type: object
                  description: >-
                    Build arguments to be passed to the build. Please write
                    numbers as strings to avoid ambiguity from number formatting
                  additionalProperties:
                    type: string
              required:
                - context
        replicas:
          type: integer
          description: >-
            Number of replicas of this container to run. Set to 1 for stateful
            applications. Default 1. Unsupported when instancer is enabled.
          minimum: 1
        environment:
          type: object
          description: >-
            Environment variables to set within the container. Please format all
            values as strings. Keys without values are not supported.
          additionalProperties:
            type: string
        ports:
          type: array
          description: >-
            Port numbers (as integers) on this container to expose to other
            containers within this challenge. If a port is supposed to be
            exposed to the Internet, make sure it is specified here, and add it
            to the top level 'expose' key.

            This key exists to ensure Kubernetes services have the correct
            ports configured on each service. Due to restrictions with Docker
            Compose / Docker Swarm, remapping ports as can be done with
            Kubernetes services is not possible.
          items:
            type: integer
        securityContext:
          type: object
          properties:
            privileged:
              type: boolean
              description: >-
                Whether or not this container should be run in privileged mode.
          required:
            - privileged
        resources:
          type: object
          description: >-
            Compute resource requests and limits for this container. This
            follows the same format as Kubernetes's resources property on
            container specs.

            Not all features are supported by all backends (though limits should
            work on most).
          properties:
            limits:
              type: object
              description: >-
                Compute resource limits for this container. Using more of a
                resource than the limit is not allowed.
              properties:
                cpu:
                  description: >-
                    CPU usage limits for this container - 1 unit corresponds to
                    1 CPU second per (wall-clock) second.
                  $ref: "#/definitions/cpu-value"
                memory:
                  description: >-
                    Memory usage limits for this container.
                  $ref: "#/definitions/memory-value"
              required:
                - cpu
                - memory
            requests:
              type: object
              description: >-
                Compute resource requets for this container.
              properties:
                cpu:
                  description: >-
                    CPU usage requests for this container - 1 unit corresponds to
                    1 CPU second per (wall-clock) second.
                  $ref: "#/definitions/cpu-value"
                memory:
                  description: >-
                    Memory usage requests for this container.
                  $ref: "#/definitions/memory-value"
              required:
                - cpu
                - memory
          required:
            - limits
            - requests
      anyOf:
        - required:
            - image
        - required:
            - build
    propertyNames:
      $ref: "#/definitions/domainsafe-name"
  expose:
    type: object
    description: >-
      Ports on containers to expose to the Internet. Keys correspond to the key
      of the container that the rule is targeting.
    additionalProperties:
      type: array
      items:
        type: object
        properties:
          target:
            type: integer
            description: >-
              The port number on the container this rule targets.
          tcp:
            type: integer
            description: >-
              The external port number to expose, treating this port as raw TCP.
          http:
            type: string
            description: >-
              Hostname to expose this port as HTTP.
          tls:
            description: >-
              Configuration to expose this port as TLS.
            oneOf:
              - type: string
                description: >-
                  Hostname to expose this port as TLS.
              - type: object
                properties:
                  hostname:
                    type: string
                    description: >-
                      Hostname to expose this port as TLS.
                  alpn:
                    type: array
                    items:
                      type: string
                    description: >-
                      List of ALPN protocols to negotiate for this expose. Defaults to http/1.1 only.
                  entrypoint:
                    type: string
                    description: >-
                      Entrypoint to use for this expose. Defaults to the TCP entrypoint only.
                      The entrypoint controls the externally listening port.
                    enum:
                      - tcp
                      - https
                required:
                  - hostname
          healthContent:
            type: string
            minLength: 1
            description: >-
              Content to expect when checking the health of this port. If not
              specified, the health check will only check if if the connection
              succeeds (for TCP) or if the server responds (for HTTP).
          rateLimit:
            type: boolean
            description: >-
              Whether to apply a IP-based request rate limit to this expose.
              Supported for HTTP exposes only. Defaults to false.
        oneOf:
          - required:
              - http
          - required:
              - tcp
            not:
              required:
                - rateLimit
          - required:
              - tls
            not:
              required:
                - rateLimit
        required:
          - target
    propertyNames:
      $ref: "#/definitions/domainsafe-name"
  instancer:
    type: object
    description: >-
      Configuration for the instancer service, which can create challenges for
      competitors on demand.
    properties:
      name:
        type: string
        description: >-
          Name of the challenge in the instancer. Defaults to challenge name.
      timeout:
        type: integer
        minimum: 0
        description: >-
          Timeout in milliseconds for the lifetime of each instance.
    required:
      - timeout
  adminbot:
    type: string
    description: >-
      Path to adminbot configuration file for this challenge.
dependentSchemas:
  instancer:
    type: object
    properties:
      containers:
        type: object
        additionalProperties:
          type: object
          properties:
            # instancer doesnt support container replicas
            replicas:
              const: 1
            # instancer requires at least one port
            ports:
              type: array
              minItems: 1
          required:
            - ports
      expose:
        type: object
        minProperties: 1
        maxProperties: 1
        additionalProperties:
          type: array
          items:
            type: object
            # instancer doesnt support tcp exposes
            oneOf:
              - required:
                  - http
              - required:
                  - tls
required:
  - description
  - author
  - flag
